
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotex Signal Pro V1</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      max-width: 420px;
      margin: 30px auto;
      padding: 24px;
      background: #151d30;
      border-radius: 18px;
      text-align: center;
    }
    h1 { color: #5eead4; }
    .signal {
      margin: 24px 0;
      padding: 20px;
      border-radius: 12px;
      background: #202c43;
    }
    .wait { color: #facc15; font-size: 28px; font-weight: bold; }
    .note { color: #b7c3d8; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Quotex Signal Pro V1</h1>
    <p>1-Minute Signal Dashboard</p>
    <div class="signal">
      <p>Current Signal</p>
      <div class="wait">WAIT</div>
      <p>Market data not connected</p>
    </div>
    <p class="note">
      Signals are not live yet. Connect a verified market-data
      source and signal engine before using this dashboard.
    </p>
  </div>
</body>
</html>
